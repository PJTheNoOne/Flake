# Dev boxes. Declarative; recreate any of them from scratch at any time.
#
#   distrobox assemble create --file ~/nix/distrobox/distrobox.ini                 # both
#   distrobox assemble create --file ~/nix/distrobox/distrobox.ini --name decky    # one
#   distrobox assemble create --replace --file ~/nix/distrobox/distrobox.ini --name android   # rebuild one
#   distrobox assemble rm --file ~/nix/distrobox/distrobox.ini                     # delete both
#
# Then:  cd ~/dev/some-project && distrobox enter android
#
# Notes
# - `home=` only gives each box its own $HOME (no dotfile litter). Distrobox STILL mounts
#   your real home at its real path, so this is tidiness, not a security boundary.
# - additional_packages / init_hooks run on EVERY start. The scripts are idempotent.
# - Paths below assume user `pj` and this repo at ~/nix. Change them together if that moves.

[android]
image=quay.io/toolbx/arch-toolbox:latest
pull=true
home=/home/pj/.local/share/distrobox/android
init=false
nvidia=false
root=false
start_now=true
# unzip: needed to unpack the cmdline-tools. nodejs/npm: for pi.
additional_packages="jdk17-openjdk nodejs npm unzip zip git openssh curl wget ripgrep fd jq less which"
additional_flags="--env JAVA_HOME=/usr/lib/jvm/java-17-openjdk --env ANDROID_HOME=/home/pj/.local/share/distrobox/android/Android/Sdk --env ANDROID_SDK_ROOT=/home/pj/.local/share/distrobox/android/Android/Sdk"
# Share your existing pi config (models, skills, auth) with the box.
additional_flags="--env PI_CODING_AGENT_DIR=/home/pj/nix/common/pi/agent"
init_hooks="bash /home/pj/nix/distrobox/setup/android.sh /home/pj/.local/share/distrobox/android"

[decky]
image=quay.io/toolbx/ubuntu-toolbox:24.04
pull=true
home=/home/pj/.local/share/distrobox/decky
init=false
nvidia=false
root=false
start_now=true
# xz-utils: unpack the Node tarball. build-essential: plugins with compiled backends.
# rsync/openssh-client/sshpass: the template's "deploy to Deck" scripts.
additional_packages="build-essential git curl wget unzip zip xz-utils rsync openssh-client sshpass jq python3 python3-pip python3-venv ripgrep fd-find less"
# Host docker socket: the Decky CLI builds plugin backends through docker.
volume="/var/run/docker.sock:/var/run/docker.sock"
additional_flags="--env PI_CODING_AGENT_DIR=/home/pj/nix/common/pi/agent"
init_hooks="bash /home/pj/nix/distrobox/setup/decky.sh /home/pj/.local/share/distrobox/decky"
